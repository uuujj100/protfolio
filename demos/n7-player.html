<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N7 Player · 视频播放模块演示</title>
<style>
  :root{--bg:#14101d;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);
        --text:#fff;--muted:#a29fb4;--dim:#6f6c82;--accent:#7b5cff;--accent2:#a271ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:min(1080px,94vw);padding:28px 0 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
        background:linear-gradient(140deg,#8f6bff,#5b3fd6);font-size:17px}
  h1{font-size:20px;margin:0;letter-spacing:.4px}
  .sub{font-size:12.5px;color:var(--dim);margin-left:auto}

  .stage{position:relative;border-radius:14px;overflow:hidden;background:#000;
         border:1px solid var(--line);aspect-ratio:16/9;display:grid;place-items:center}
  video{width:100%;height:100%;display:block;background:#000}
  .empty{position:absolute;text-align:center;color:var(--dim);font-size:13.5px;line-height:2}
  .empty b{color:var(--muted);font-weight:600}
  .cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
       max-width:82%;padding:8px 16px;border-radius:8px;
       background:rgba(0,0,0,.66);color:#fff;font-size:17px;line-height:1.5;
       text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);
       opacity:0;transition:opacity .12s;pointer-events:none;white-space:pre-wrap}
  .cue.on{opacity:1}

  .bar{margin-top:14px;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:14px 16px}
  .track{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.1);
         cursor:pointer;margin-bottom:12px}
  .buf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);border-radius:3px;width:0}
  .prog{position:absolute;left:0;top:0;bottom:0;border-radius:3px;width:0;
        background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
         padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.18s}
  button:hover{background:rgba(255,255,255,.12)}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;
                 box-shadow:0 6px 18px rgba(123,92,255,.28)}
  button.off{opacity:.45}
  select{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
         padding:7px 10px;border-radius:8px;font-size:13px}
  .time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .grow{flex:1}
  input[type=range]{width:92px;accent-color:var(--accent)}

  .picker{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .picker input[type=text]{flex:1;min-width:240px;background:rgba(255,255,255,.05);
        border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px}
  .keys{margin-top:18px;font-size:12.5px;color:var(--dim);line-height:2}
  kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;
      padding:1px 7px;font-size:11.5px;color:var(--muted);font-family:inherit}
  .stats{margin-top:16px;display:flex;gap:26px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
  .stats b{color:var(--muted);font-weight:600}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
         background:rgba(30,24,45,.96);border:1px solid rgba(160,120,255,.4);color:#dcd6ff;
         padding:12px 20px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">◈</div>
    <h1>N7 Player · 视频播放模块</h1>
    <span class="sub">纯前端实现 · 无依赖 · 单文件</span>
  </header>

  <div class="stage">
    <video id="v" playsinline></video>
    <div class="cue" id="cue"></div>
    <div class="empty" id="empty">
      <b>选择一个本地视频，或粘贴视频地址</b><br>
      播放进度会按「文件名 + 大小」自动记忆，下次打开接着看
    </div>
  </div>

  <div class="bar">
    <div class="track" id="track">
      <div class="buf" id="buf"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="row">
      <button class="primary" id="play">播放</button>
      <span class="time" id="tcur">00:00</span>
      <span class="time">/</span>
      <span class="time" id="tdur">00:00</span>
      <div class="grow"></div>
      <button id="sub" title="显示/隐藏字幕（C）">字幕 · 关</button>
      <button id="back10">« 10s</button>
      <button id="fwd10">10s »</button>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2.0×</option>
      </select>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1" title="音量">
      <button id="mute">静音</button>
      <button id="fs">全屏</button>
    </div>
  </div>

  <div class="picker">
    <input type="file" id="file" accept="video/*" hidden>
    <button id="pick">选择本地文件</button>
    <input type="text" id="url" placeholder="或粘贴视频直链（mp4 / webm）">
    <button id="load">加载</button>
  </div>

  <div class="picker">
    <input type="file" id="vttIn" accept=".vtt,text/vtt" hidden>
    <button id="pickVtt">加载字幕 (.vtt)</button>
    <button id="demoVtt">载入示例字幕</button>
  </div>

  <div class="keys">
    <kbd>空格</kbd> 播放/暂停　<kbd>←</kbd><kbd>→</kbd> 快退/快进 5 秒　
    <kbd>↑</kbd><kbd>↓</kbd> 音量　<kbd>M</kbd> 静音　<kbd>C</kbd> 字幕　<kbd>F</kbd> 全屏
  </div>

  <div class="stats">
    <span>分辨率 <b id="sRes">—</b></span>
    <span>时长 <b id="sDur">—</b></span>
    <span>已缓冲 <b id="sBuf">—</b></span>
    <span>字幕轨 <b id="sSub">未加载</b></span>
    <span>源 <b id="sSrc">—</b></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const v = $('v'), empty = $('empty'), cueEl = $('cue');
  const prog = $('prog'), buf = $('buf'), track = $('track');
  const playBtn = $('play'), tcur = $('tcur'), tdur = $('tdur');
  const speed = $('speed'), vol = $('vol'), muteBtn = $('mute');
  const fileIn = $('file'), urlIn = $('url'), toastEl = $('toast');
  const subBtn = $('sub'), vttIn = $('vttIn');

  const KEY = 'n7player:progress';
  let currentKey = null;

  // 字幕状态
  let cues = [];         // [{start, end, text}]
  let subOn = false;
  let activeCue = -1;

  const fmt = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  };
  const toast = msg => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
  };

  // ---------------- 进度记忆 ----------------
  const readStore = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
  const saveProgress = () => {
    if (!currentKey || !isFinite(v.duration) || v.currentTime < 3) return;
    const all = readStore();
    all[currentKey] = { t: v.currentTime, d: v.duration, at: Date.now() };
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch {}
  };
  const restoreProgress = () => {
    const rec = readStore()[currentKey];
    if (rec && rec.t > 3 && rec.t < rec.d - 3) {
      v.currentTime = rec.t;
      toast('已恢复到上次观看位置 ' + fmt(rec.t));
    }
  };

  // ---------------- 载入视频 ----------------
  const useSource = (src, key, label) => {
    currentKey = key;
    empty.style.display = 'none';
    v.src = src; v.load();
    $('sSrc').textContent = label;
    v.play().catch(() => {});
  };
  $('pick').onclick = () => fileIn.click();
  fileIn.onchange = () => {
    const f = fileIn.files[0]; if (!f) return;
    useSource(URL.createObjectURL(f), `f:${f.name}:${f.size}`, f.name);
  };
  $('load').onclick = () => {
    const u = urlIn.value.trim();
    if (!u) return toast('先填一个视频地址');
    useSource(u, `u:${u}`, '远程地址');
  };

  // ---------------- 字幕：自己解析 WebVTT ----------------
  // 为什么不用 <track> + track.mode='showing'：
  //   原生渲染无法改样式、无法在无视频时预览、跨浏览器对齐方式不一致。
  //   手工解析只有几十行，换来完全可控的渲染。
  const TS = String.raw`(\d{1,2}):(\d{2}):(\d{2})[.,](\d{3})`;
  const CUE_RE = new RegExp(TS + String.raw`\s*-->\s*` + TS);

  const parseVtt = text => {
    const out = [];
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    let i = 0;
    while (i < lines.length) {
      const m = lines[i].match(CUE_RE);
      if (m) {
        const toSec = (h, mi, s, ms) => (+h) * 3600 + (+mi) * 60 + (+s) + (+ms) / 1000;
        const start = toSec(m[1], m[2], m[3], m[4]);
        const end   = toSec(m[5], m[6], m[7], m[8]);
        const bufLines = [];
        i++;
        while (i < lines.length && lines[i].trim() !== '') { bufLines.push(lines[i]); i++; }
        const txt = bufLines.join('\n').trim();
        if (txt) out.push({ start, end, text: txt });
      } else i++;
    }
    return out.sort((a, b) => a.start - b.start);
  };

  const SAMPLE_VTT = `WEBVTT

00:00:00.000 --> 00:00:04.000
字幕已加载 · 这是一条演示字幕

00:00:04.000 --> 00:00:08.000
播放到第 4 秒，字幕会自动切换

00:00:08.000 --> 00:00:12.000
时间轴是绝对的，跟视频内容无关

00:00:12.000 --> 00:00:16.000
按 C 可以开关字幕<br>这一行演示了换行

00:00:16.000 --> 00:00:20.000
拖动进度条，字幕会跟着重算

00:00:20.000 --> 00:00:25.000
手工解析 VTT 只有几十行，换来的
是完全可控的渲染样式
`;

  const setCues = (list, name) => {
    cues = list;
    activeCue = -1;
    cueEl.classList.remove('on');
    cueEl.textContent = '';
    $('sSub').textContent = name + '（' + list.length + ' 条）';
    if (!subOn) toggleSub(true);        // 加载后自动开启，方便看到效果
    toast('已加载字幕：' + list.length + ' 条');
  };

  const toggleSub = force => {
    subOn = (typeof force === 'boolean') ? force : !subOn;
    subBtn.textContent = '字幕 · ' + (subOn ? '开' : '关');
    subBtn.classList.toggle('off', !subOn);
    if (!subOn) { cueEl.classList.remove('on'); activeCue = -1; }
    else renderCue();
  };

  const renderCue = () => {
    if (!subOn || !cues.length) return;
    const t = v.currentTime;
    let idx = -1;
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].start && t < cues[i].end) { idx = i; break; }
    }
    if (idx === activeCue) return;
    activeCue = idx;
    if (idx === -1) { cueEl.classList.remove('on'); }
    else { cueEl.textContent = cues[idx].text; cueEl.classList.add('on'); }
  };

  $('pickVtt').onclick = () => vttIn.click();
  vttIn.onchange = () => {
    const f = vttIn.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const list = parseVtt(r.result);
      if (!list.length) return toast('这个文件里没解析到字幕条目');
      setCues(list, f.name);
    };
    r.readAsText(f, 'utf-8');
  };
  $('demoVtt').onclick = () => {
    const list = parseVtt(SAMPLE_VTT);
    setCues(list, '示例');
  };
  subBtn.onclick = () => toggleSub();
  toggleSub(false);

  // ---------------- 播放控制 ----------------
  const toggle = () => v.paused ? v.play().catch(()=>{}) : v.pause();
  playBtn.onclick = toggle;
  v.onclick = toggle;
  $('back10').onclick = () => v.currentTime -= 10;
  $('fwd10').onclick  = () => v.currentTime += 10;
  speed.onchange = () => v.playbackRate = parseFloat(speed.value);
  vol.oninput = () => { v.volume = parseFloat(vol.value); v.muted = v.volume === 0; };
  muteBtn.onclick = () => { v.muted = !v.muted; muteBtn.textContent = v.muted ? '取消静音' : '静音'; };
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else v.parentElement.requestFullscreen();
  };

  const seekFromEvent = e => {
    const r = track.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (isFinite(v.duration)) v.currentTime = p * v.duration;
  };
  let dragging = false;
  track.onpointerdown = e => { dragging = true; seekFromEvent(e); track.setPointerCapture(e.pointerId); };
  track.onpointermove = e => { if (dragging) seekFromEvent(e); };
  track.onpointerup   = () => { dragging = false; };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); toggle(); }
    else if (k === 'arrowright') v.currentTime += 5;
    else if (k === 'arrowleft')  v.currentTime -= 5;
    else if (k === 'arrowup')    { e.preventDefault(); v.volume = Math.min(1, v.volume + 0.1); vol.value = v.volume; }
    else if (k === 'arrowdown')  { e.preventDefault(); v.volume = Math.max(0, v.volume - 0.1); vol.value = v.volume; }
    else if (k === 'm') muteBtn.click();
    else if (k === 'c') toggleSub();
    else if (k === 'f') $('fs').click();
  });

  // ---------------- 状态渲染 ----------------
  v.onloadedmetadata = () => {
    tdur.textContent = fmt(v.duration);
    $('sRes').textContent = v.videoWidth + '×' + v.videoHeight;
    $('sDur').textContent = fmt(v.duration);
    restoreProgress();
  };
  v.ontimeupdate = () => {
    tcur.textContent = fmt(v.currentTime);
    if (isFinite(v.duration) && v.duration > 0)
      prog.style.width = (v.currentTime / v.duration * 100) + '%';
    renderCue();
  };
  v.onseeked = renderCue;
  v.onprogress = () => {
    if (!v.buffered.length || !v.duration) return;
    const end = v.buffered.end(v.buffered.length - 1);
    buf.style.width = (end / v.duration * 100) + '%';
    $('sBuf').textContent = fmt(end) + ' / ' + fmt(v.duration);
  };
  v.onplay  = () => playBtn.textContent = '暂停';
  v.onpause = () => { playBtn.textContent = '播放'; saveProgress(); };
  v.onended = () => { playBtn.textContent = '播放'; saveProgress(); };

  setInterval(saveProgress, 5000);
  window.addEventListener('beforeunload', saveProgress);
})();
</script>
</body>
</html>
